<title>Croquis de Campo</title>

<style>
/* Layout: app de una pantalla — barra superior, plano en papel milimetrado a todo lo ancho, panel contextual y herramientas al alcance del pulgar */
:root{
  --paper:#f6f8f5; --grid:#e1e8e3; --grid-strong:#c4d2ca; --ink:#1c3a4e; --fill:rgba(46,110,140,.10); --fill-sel:rgba(226,97,27,.14);
  --accent:#d9581a; --dim:#3b6276; --surface:#ffffff; --surface-2:#edf1ed; --line:#d2dad5; --text:#182a33; --muted:#5a6c74;
  --danger:#b3322a; --ghost:rgba(104,116,124,.17); --ghost-line:rgba(84,98,108,.62); --surf:rgba(96,150,64,.15); --surf-line:#4c8032;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11191e; --grid:#1b272e; --grid-strong:#283a43; --ink:#cde2ec; --fill:rgba(120,190,220,.11); --fill-sel:rgba(255,138,61,.16);
  --accent:#ff8a3d; --dim:#98bdd0; --surface:#172228; --surface-2:#1f2c33; --line:#2b3c45; --text:#e2ecf0; --muted:#8ea3ac; --danger:#ff6f62; --ghost:rgba(170,186,196,.10); --ghost-line:rgba(170,188,198,.50); --surf:rgba(140,205,105,.13); --surf-line:#8fc56d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11191e; --grid:#1b272e; --grid-strong:#283a43; --ink:#cde2ec; --fill:rgba(120,190,220,.11); --fill-sel:rgba(255,138,61,.16);
  --accent:#ff8a3d; --dim:#98bdd0; --surface:#172228; --surface-2:#1f2c33; --line:#2b3c45; --text:#e2ecf0; --muted:#8ea3ac; --danger:#ff6f62; --ghost:rgba(170,186,196,.10); --ghost-line:rgba(170,188,198,.50); --surf:rgba(140,205,105,.13); --surf-line:#8fc56d; color-scheme:dark}

html,body{height:100%}
html{background:var(--surface)}
body{background:var(--paper);color:var(--text);font:15px/1.35 var(--f-ui);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
.app{height:100%;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
input{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.top{display:flex;align-items:center;gap:2px;padding-block:6px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:3}
.ib{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--text)}
.ib:active:not(:disabled){background:var(--surface-2)}
.name{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;padding:2px 6px;border-radius:8px;text-align:left}
.eyebrow{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#nameTxt{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

.stage{flex:1;position:relative;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;touch-action:none;display:block}
.chip{position:absolute;top:56px;left:calc(12px + env(safe-area-inset-left,0px));background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font:500 13px var(--f-num);font-variant-numeric:tabular-nums;color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.08);pointer-events:none}
.chip b{color:var(--accent);font-weight:500}
#loupe{position:absolute;width:128px;height:128px;border-radius:50%;border:2px solid var(--accent);box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none;background:var(--paper)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;background:var(--text);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:14px;pointer-events:none;white-space:nowrap}

.dock{background:var(--surface);border-top:1px solid var(--line);position:relative;z-index:3}
.panel{padding-block:10px;border-bottom:1px solid var(--line)}
#pDraw{display:flex;gap:14px;align-items:flex-start}
.drawL{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lenrow{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:2px}
.lenrow:focus-within{border-color:var(--accent)}
.lenrow input{flex:1;min-width:0;width:100%;border:0;background:transparent;font:500 26px var(--f-num);padding:0;outline:none}
.lenrow .unit{font:500 15px var(--f-num);color:var(--muted)}
.lenrow.sm{width:118px;flex:none}
.lenrow.sm input{font-size:20px}
.hint{margin:0;font-size:13px;color:var(--muted);line-height:1.3;max-width:62ch}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{height:36px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);font-weight:500;font-size:14px;white-space:nowrap}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.pad{display:grid;grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px);gap:4px;flex:none}
.pad button{border-radius:9px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center}
.pad button svg{width:18px;height:18px}
.pad .c{font:500 12px var(--f-num);color:var(--muted);background:transparent;border-style:dashed}
.pad button:not(:disabled):active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sel{display:flex;flex-direction:column;gap:8px}
.selhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.meta{font:13px var(--f-num);color:var(--muted);font-variant-numeric:tabular-nums}
.txt{flex:1;min-width:130px;height:36px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--paper)}

.tools{display:grid;grid-template-columns:repeat(4,1fr) 1px repeat(3,1fr);gap:2px;padding-block:4px}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 5px;border-radius:10px;font-size:12px;color:var(--muted);font-weight:500;position:relative}
.tool[aria-pressed="true"]{color:var(--accent);background:var(--surface-2)}
.tog[aria-pressed="true"]{color:var(--text);background:transparent}
.tog::after{content:"";position:absolute;top:6px;right:calc(50% - 19px);width:7px;height:7px;border-radius:50%;background:var(--line)}
.tog[aria-pressed="true"]::after{background:var(--accent)}
.sep{background:var(--line);margin:8px 0}

.scrim{position:fixed;inset:0;background:rgba(8,18,24,.42);z-index:10}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;z-index:11;background:var(--surface);border-radius:16px 16px 0 0;max-height:84%;overflow:auto;padding-block:8px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(0,0,0,.2);-webkit-user-select:text;user-select:text}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 4px}
.shead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet h2{font-size:21px;margin:4px 0;font-weight:600;text-wrap:balance}
.sub{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 6px;font-weight:500}
.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.field>span{font-size:13px;color:var(--muted)}
.field input{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--paper)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.item{display:flex;flex-direction:column;align-items:flex-start;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);gap:2px}
.item:last-child{border-bottom:0}
.item.cur{background:var(--surface-2)}
.iname{font-weight:600}
.imeta{font-size:12.5px;color:var(--muted);font-family:var(--f-num)}
.badge{font-style:normal;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;font-weight:500;vertical-align:2px}
.segc{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.segc button{flex:1;height:36px;font:500 13px var(--f-num);border-right:1px solid var(--line)}
.segc button:last-child{border-right:0}
.segc button.on{background:var(--ink);color:var(--paper)}
.sw{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:15px}
.sw input{width:20px;height:20px;accent-color:var(--accent);flex:none}
table.areas{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:8px 0 14px}
.areas td{padding:9px 0;border-bottom:1px solid var(--line);vertical-align:top}
.areas td.n{text-align:right;font-family:var(--f-num);white-space:nowrap}
.areas small{color:var(--muted);display:block;font-size:12px;font-family:var(--f-num)}
.areas tr.tot td{font-weight:600;border-bottom:0;border-top:2px solid var(--ink)}
.empty{color:var(--muted);font-size:14px;margin:12px 0}
.expimg{display:block;width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;margin:10px 0;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
textarea.copy{width:100%;min-height:120px;font:13px var(--f-num);border:1px solid var(--line);border-radius:9px;padding:8px;background:var(--paper);color:var(--text)}

.dlg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(8,18,24,.42);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dlgbox{width:min(380px,100%);background:var(--surface);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 16px 40px rgba(0,0,0,.25)}
.dlgbox h3{margin:0;font-size:18px;font-weight:600}
.dlgbox p{margin:0;color:var(--muted);font-size:14px}
.dlgbox input{height:42px;border:1px solid var(--line);border-radius:9px;padding:0 10px;background:var(--paper)}
.row.end{justify-content:flex-end}
.levels{position:absolute;top:8px;left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));display:flex;gap:6px;align-items:center;z-index:2;pointer-events:none}
.lvscroll{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;pointer-events:auto;padding:2px}
.lvscroll::-webkit-scrollbar{display:none}
.lv{flex:none;height:38px;padding:0 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.07);display:inline-flex;align-items:center;gap:6px;pointer-events:auto}
.lv.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lv.on::after{content:"";width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.7}
.lv.add{padding:0 12px;color:var(--accent)}
.lv.add svg{width:18px;height:18px}
.lv.gh{padding:0 10px;color:var(--muted);font-weight:500;font-size:13px}
.lv.gh svg{width:19px;height:19px}
.lv.gh[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.brand{height:34px;width:auto;border-radius:7px;flex:none;margin:0 4px 0 2px;display:block}
.v3d{position:fixed;inset:0;z-index:15;background:var(--paper);display:flex;flex-direction:column}
.v3d .top{flex:none}
.v3d .t3{flex:1;font-weight:600;font-size:17px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3stage{flex:1;position:relative;min-height:0;overflow:hidden}
.v3stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.v3msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:15px;text-align:center;padding:24px}
.v3help{position:absolute;left:50%;transform:translateX(-50%);bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--muted);white-space:nowrap;pointer-events:none}
.v3d .dock{padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.v3row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.v3row .segc{flex:1;min-width:220px}
.v3row .lenrow.sm{width:96px}
@media (max-width:520px){.lv.gh span{display:none}.lv.gh{padding:0 9px}#b3d span{display:inline;font-weight:600;font-size:14px;color:var(--text)}#b3d svg{display:none}#b3d{padding:0 12px}}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<script>
(()=>{
const $=s=>document.querySelector(s);
const cv=$('#cv'), g=cv.getContext('2d'), stage=$('#stage');
const loupe=$('#loupe'), lg=loupe.getContext('2d');
let W=0,H=0,DPR=1;
const C={};
function readColors(){const cs=getComputedStyle(document.documentElement);['paper','grid','grid-strong','ink','fill','fill-sel','accent','dim','text','muted','ghost','ghost-line','surf','surf-line'].forEach(k=>C[k]=cs.getPropertyValue('--'+k).trim());}
readColors();

const F_NUM='"IBM Plex Mono", ui-monospace, Menlo, monospace';
const F_UI='"IBM Plex Sans Condensed", "Arial Narrow", sans-serif';

/* ---------- datos de ejemplo ---------- */
function blankDoc(){return {pts:{},lines:[],labels:[],n:1};}
function sampleDoc(){
  const d=blankDoc();
  const P=(x,y)=>{const id='p'+d.n++;d.pts[id]={x,y};return id;};
  const A=P(0,0),Hh=P(6,0),B=P(10,0),Cc=P(10,8),J=P(6,8),D=P(4,8),E=P(0,8),F=P(0,10.5),G=P(4,10.5);
  d.lines.push({id:'l'+d.n++,pts:[A,Hh,B,Cc,J,D,E],closed:true,name:'Casa'});
  d.lines.push({id:'l'+d.n++,pts:[E,F,G,D],closed:true,name:'Porche'});
  d.lines.push({id:'l'+d.n++,pts:[Hh,J],closed:false,name:''});
  d.labels.push({id:'t'+d.n++,x:3,y:3.6,text:'Sala-comedor'});
  d.labels.push({id:'t'+d.n++,x:8,y:3.6,text:'Dormitorio'});
  d.labels.push({id:'t'+d.n++,x:5,y:12.4,text:'Frente a calle'});
  return d;
}
function sampleDoc2(){
  const d=blankDoc();
  const P=(x,y)=>{const id='p'+d.n++;d.pts[id]={x,y};return id;};
  const A=P(0,0),M=P(5,0),B=P(10,0),Cc=P(10,6),N=P(5,6),D=P(0,6);
  d.lines.push({id:'l'+d.n++,pts:[A,M,B,Cc,N,D],closed:true,name:'Planta alta'});
  d.lines.push({id:'l'+d.n++,pts:[M,N],closed:false,name:''});
  d.labels.push({id:'t'+d.n++,x:2.5,y:3,text:'Dormitorio 1'});
  d.labels.push({id:'t'+d.n++,x:7.5,y:3,text:'Dormitorio 2'});
  return d;
}

/* ---------- almacenamiento ---------- */
const KEY='croquis-campo.v1';
let store=null;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.items&&s.items[s.cur])store=s;}catch(e){}
const defaults={step:0.05,dims:true,diag:false,ortho:true,magnet:true,ghost:true};
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
if(!store){const id='c'+Date.now();store={cur:id,settings:{},items:{[id]:{name:'Ejemplo · Casa de dos plantas',updated:Date.now(),doc:sampleDoc(),view:null,example:true,
  info:{cliente:'Cliente de ejemplo',ubicacion:'Col. de ejemplo, Tegucigalpa, F.M.',lat:14.0818,lng:-87.2068,fecha:todayISO(),valuador:'',notas:'Datos de ejemplo. Crea un croquis nuevo desde el menú.'}}}};}
store.settings={...defaults,...(store.settings||{})};
const S=store.settings;
/* niveles: cada croquis guarda una lista de plantas; las versiones anteriores pasan a «Nivel 1» */
function migrate(it){
  if(!Array.isArray(it.levels)||!it.levels.length){it.levels=[{id:'v1',name:'Nivel 1',doc:it.doc||blankDoc()}];it.lvl=0;delete it.doc;
    if(it.example){it.levels.push({id:'v2',name:'Nivel 2',doc:sampleDoc2()});it.lvl=1;}}
  if(!(it.lvl>=0&&it.lvl<it.levels.length))it.lvl=0;
  return it;
}
for(const id in store.items)migrate(store.items[id]);
const curIt=()=>store.items[store.cur];
let doc=curIt().levels[curIt().lvl].doc;
let view=store.items[store.cur].view?{...store.items[store.cur].view}:{s:30,ox:0,oy:0};
let needFit=!store.items[store.cur].view;
let saveT=0;
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function scheduleSave(){const it=store.items[store.cur];it.levels[it.lvl].doc=doc;it.view={...view};it.updated=Date.now();clearTimeout(saveT);saveT=setTimeout(saveNow,300);}
window.addEventListener('pagehide',()=>{clearTimeout(saveT);saveNow();});

/* ---------- estado ---------- */
const isDrawTool=()=>tool==='line'||tool==='surface';
let tool='line', drawing=null, sel=null, preview=null, undoS=[], redoS=[], lastDir=null, lastSelKey='';

/* ---------- utilidades ---------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
const r4=v=>Math.round(v*10000)/10000;
const fmt=v=>(Math.round(v*100)/100).toFixed(2);
const w2s=p=>({x:p.x*view.s+view.ox,y:p.y*view.s+view.oy});
const s2w=p=>({x:(p.x-view.ox)/view.s,y:(p.y-view.oy)/view.s});
const getLine=id=>doc.lines.find(l=>l.id===id);
function withDoc(d,fn){const o=doc;doc=d;try{return fn();}finally{doc=o;}}
function ghostDoc(){const it=curIt();return S.ghost&&it.lvl>0?it.levels[it.lvl-1].doc:null;}
const newId=pre=>pre+(doc.n++);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function newPt(x,y){const id=newId('p');doc.pts[id]={x:r4(x),y:r4(y)};return id;}
function parseNum(s){const v=parseFloat(String(s).replace(',','.').trim());return isFinite(v)?v:NaN;}
function projSeg(p,A,B){const dx=B.x-A.x,dy=B.y-A.y,L2=dx*dx+dy*dy;let t=L2?((p.x-A.x)*dx+(p.y-A.y)*dy)/L2:0;t=clamp(t,0,1);const x=A.x+dx*t,y=A.y+dy*t;return{x,y,t,d:Math.hypot(p.x-x,p.y-y)};}
function sArea(P){let a=0;for(let i=0;i<P.length;i++){const j=(i+1)%P.length;a+=P[i].x*P[j].y-P[j].x*P[i].y;}return a/2;}
function perim(P,closed){let s=0;const m=closed?P.length:P.length-1;for(let i=0;i<m;i++)s+=dist(P[i],P[(i+1)%P.length]);return s;}
function centroid(P){const A=sArea(P);if(Math.abs(A)<1e-9){let x=0,y=0;P.forEach(p=>{x+=p.x;y+=p.y;});return{x:x/P.length,y:y/P.length};}let cx=0,cy=0;for(let i=0;i<P.length;i++){const j=(i+1)%P.length,c=P[i].x*P[j].y-P[j].x*P[i].y;cx+=(P[i].x+P[j].x)*c;cy+=(P[i].y+P[j].y)*c;}return{x:cx/(6*A),y:cy/(6*A)};}
function inPoly(p,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){if(((P[i].y>p.y)!==(P[j].y>p.y))&&(p.x<(P[j].x-P[i].x)*(p.y-P[i].y)/(P[j].y-P[i].y)+P[i].x))c=!c;}return c;}
const linePts=l=>l.pts.map(id=>doc.pts[id]);
const areaOf=l=>Math.abs(sArea(linePts(l)));
const isSurf=l=>l.kind==='surface';
function segs(kind){const out=[],seen=new Set();for(const l of doc.lines){if(kind==='w'&&isSurf(l))continue;if(kind==='s'&&!isSurf(l))continue;const n=l.pts.length,m=l.closed?n:n-1;for(let i=0;i<m;i++){const a=l.pts[i],b=l.pts[(i+1)%n];const k=(isSurf(l)?'s':'w')+(a<b?a+'|'+b:b+'|'+a);out.push({l,i,a,b,k,dup:seen.has(k)});seen.add(k);}}return out;}
/* ambientes: cada espacio cerrado que forman las líneas entre sí */
function rawFaces(){
  const adj=new Map(),add=(a,b)=>{if(!adj.has(a))adj.set(a,new Set());adj.get(a).add(b);};
  for(const s of segs('w')){if(s.dup||s.a===s.b||dist(doc.pts[s.a],doc.pts[s.b])<1e-6)continue;add(s.a,s.b);add(s.b,s.a);}
  let ch=true;while(ch){ch=false;for(const[v,ns]of adj){if(ns.size<2){for(const u of ns)adj.get(u)&&adj.get(u).delete(v);adj.delete(v);ch=true;}}}
  const order=new Map();
  for(const[v,ns]of adj){const p=doc.pts[v];order.set(v,[...ns].sort((a,b)=>Math.atan2(doc.pts[a].y-p.y,doc.pts[a].x-p.x)-Math.atan2(doc.pts[b].y-p.y,doc.pts[b].x-p.x)));}
  const seen=new Set(),out=[];
  for(const[u,ns]of order)for(const v of ns){
    if(seen.has(u+'>'+v))continue;const cyc=[];let a=u,b=v,gd=0;
    while(!seen.has(a+'>'+b)&&gd++<20000){seen.add(a+'>'+b);cyc.push(a);const nb=order.get(b);const i=nb.indexOf(a);const c=nb[(i-1+nb.length)%nb.length];a=b;b=c;}
    if(cyc.length>=3){const P=cyc.map(id=>doc.pts[id]);const A=sArea(P);if(A>1e-4)out.push({ids:cyc,P,A});}
  }
  return out;
}
function interiorPoint(P){
  const c=centroid(P);if(inPoly(c,P))return c;
  let ys=P.map(p=>p.y);const y0=Math.min(...ys),y1=Math.max(...ys);let best=null,bw=-1;
  for(let k=1;k<10;k++){const y=y0+(y1-y0)*k/10,xs=[];
    for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a.y>y)!==(b.y>y))xs.push(a.x+(y-a.y)*(b.x-a.x)/(b.y-a.y));}
    xs.sort((a,b)=>a-b);for(let i=0;i+1<xs.length;i+=2){const w=xs[i+1]-xs[i];if(w>bw){bw=w;best={x:(xs[i]+xs[i+1])/2,y};}}}
  return best||c;
}
function rooms(){
  const F=rawFaces().map(f=>({...f,c:interiorPoint(f.P)}));
  F.sort((a,b)=>(a.c.y-b.c.y)||(a.c.x-b.c.x));
  let n=0;
  for(const f of F){
    const L=doc.labels.find(l=>inPoly(l,f.P));
    if(L){f.label=L;f.name=L.text;continue;}
    const fig=doc.lines.find(l=>l.closed&&!isSurf(l)&&l.name&&Math.abs(areaOf(l)-f.A)<0.005&&inPoly(f.c,linePts(l)));
    f.name=fig?fig.name:'Ambiente '+(++n);
  }
  return F;
}
const samePair=(s,t)=>(s.a===t.a&&s.b===t.b)||(s.a===t.b&&s.b===t.a);

/* ---------- edición del modelo ---------- */
function cleanLine(l){const out=[];for(const p of l.pts){if(out[out.length-1]!==p)out.push(p);}if(out.length>1&&out[0]===out[out.length-1]){out.pop();if(out.length>=3)l.closed=true;}l.pts=out;if(l.closed&&out.length<3)l.closed=false;}
function normalize(){doc.lines.forEach(cleanLine);doc.lines=doc.lines.filter(l=>l.pts.length>=2||l.id===drawing);const used=new Set();doc.lines.forEach(l=>l.pts.forEach(p=>used.add(p)));for(const id in doc.pts)if(!used.has(id))delete doc.pts[id];if(drawing&&!getLine(drawing))drawing=null;}
function insertBetween(a,b,id){for(const l of doc.lines){const n=l.pts.length;for(let i=0;i<n;i++){const j=(i+1)%n;if(j===0&&!l.closed)break;const p=l.pts[i],q=l.pts[j];if((p===a&&q===b)||(p===b&&q===a)){l.pts.splice(i+1,0,id);break;}}}}
function mergePts(a,b){for(const l of doc.lines)l.pts=l.pts.map(p=>p===a?b:p);delete doc.pts[a];normalize();}
function deleteSeg(a,b){const out=[];for(const l of doc.lines){const n=l.pts.length;let idx=-1;for(let i=0;i<n;i++){const j=(i+1)%n;if(j===0&&!l.closed)break;const p=l.pts[i],q=l.pts[j];if((p===a&&q===b)||(p===b&&q===a)){idx=i;break;}}if(idx<0){out.push(l);continue;}if(l.closed){l.pts=l.pts.slice(idx+1).concat(l.pts.slice(0,idx+1));l.closed=false;out.push(l);}else{const A=l.pts.slice(0,idx+1),B=l.pts.slice(idx+1);if(A.length>=2)out.push({...l,pts:A});if(B.length>=2)out.push({...l,id:newId('l'),pts:B});}}doc.lines=out;normalize();}
function deletePt(id){for(const l of doc.lines)l.pts=l.pts.filter(p=>p!==id);normalize();}
function nextAreaName(){return 'Área '+(doc.lines.filter(l=>l.closed&&!isSurf(l)).length+1);}
function nextSurfName(){const n=doc.lines.filter(l=>l.closed&&isSurf(l)).length-1;return n>0?'Superficie '+(n+1):'Terreno';}

/* ---------- deshacer ---------- */
const snapshot=()=>JSON.stringify({doc,drawing});
function pushUndo(){undoS.push(snapshot());if(undoS.length>150)undoS.shift();redoS=[];}
function restore(s){const o=JSON.parse(s);doc=o.doc;drawing=o.drawing;sel=null;preview=null;changed();}
function undo(){if(!undoS.length)return;redoS.push(snapshot());restore(undoS.pop());}
function redo(){if(!redoS.length)return;undoS.push(snapshot());restore(redoS.pop());}
function changed(){scheduleSave();updateUI();render();}

/* ---------- imán ---------- */
function snap(raw,o={}){
  const thr=20/view.s, ex=o.exclude, gd=ghostDoc(), gpts=gd?Object.values(gd.pts):[];
  const list=segs().filter(s=>!s.dup&&s.a!==ex&&s.b!==ex);
  if(S.magnet){
    let best=null,bd=thr;
    for(const id in doc.pts){if(id===ex)continue;const d=dist(doc.pts[id],raw);if(d<bd){bd=d;best=id;}}
    if(best){const p=doc.pts[best];return{x:p.x,y:p.y,kind:'Punto',id:best,guides:[]};}
    if(gpts.length){let gb=null,gbd=thr;for(const p of gpts){const d=dist(p,raw);if(d<gbd){gbd=d;gb=p;}}if(gb)return{x:gb.x,y:gb.y,kind:'Nivel inferior',guides:[]};}
    let bm=null;bd=thr*0.7;
    for(const s of list){const m=mid(doc.pts[s.a],doc.pts[s.b]);const d=dist(m,raw);if(d<bd){bd=d;bm={x:m.x,y:m.y,kind:'Mitad',seg:s,guides:[]};}}
    if(bm)return bm;
  }
  const st=S.step, res={x:raw.x,y:raw.y,kind:'',guides:[]};
  if(o.from&&S.ortho){
    const f=o.from,dx=raw.x-f.x,dy=raw.y-f.y;
    if(Math.hypot(dx,dy)<1e-9)return{x:f.x,y:f.y,kind:'',guides:[]};
    const inc=S.diag?Math.PI/4:Math.PI/2,ang=Math.round(Math.atan2(dy,dx)/inc)*inc;
    let ux=Math.cos(ang),uy=Math.sin(ang);if(Math.abs(ux)<1e-9)ux=0;if(Math.abs(uy)<1e-9)uy=0;
    const proj=dx*ux+dy*uy, t=Math.round(proj/st)*st;
    res.x=f.x+ux*t;res.y=f.y+uy*t;res.kind=(ux&&uy)?'45°':'90°';
    if(S.magnet){
      let bt=null,bd=thr,bs=null;
      for(const s of list){if(s.a===o.fromId||s.b===o.fromId)continue;const A=doc.pts[s.a],B=doc.pts[s.b];const ex_=B.x-A.x,ey=B.y-A.y,den=ux*ey-uy*ex_;if(Math.abs(den)<1e-12)continue;const wx=A.x-f.x,wy=A.y-f.y;const tt=(wx*ey-wy*ex_)/den,v=(wx*uy-wy*ux)/den;if(v<-0.001||v>1.001||tt<1e-6)continue;const d=Math.abs(tt-proj);if(d<bd){bd=d;bt=tt;bs=s;}}
      if(bs){res.x=f.x+ux*bt;res.y=f.y+uy*bt;res.kind='Cruce';res.seg=bs;for(const id of[bs.a,bs.b]){if(dist(doc.pts[id],res)<1e-4){res.id=id;res.kind='Punto';res.seg=null;}}}
      else if(ux===0||uy===0){
        const horiz=uy===0;let bp=null,bd2=thr;
        for(const id in doc.pts){if(id===ex||id===o.fromId)continue;const p=doc.pts[id];const d=horiz?Math.abs(p.x-res.x):Math.abs(p.y-res.y);if(d<bd2){bd2=d;bp=p;}}
        for(const p of gpts){const d=horiz?Math.abs(p.x-res.x):Math.abs(p.y-res.y);if(d<bd2){bd2=d;bp=p;}}
        if(bp){if(horiz)res.x=bp.x;else res.y=bp.y;res.kind='Alineado';res.guides.push({a:{x:bp.x,y:bp.y},b:{x:res.x,y:res.y}});}
      }
    }
    return res;
  }
  res.x=Math.round(raw.x/st)*st;res.y=Math.round(raw.y/st)*st;
  if(S.magnet){
    let ax=null,ay=null,bx=thr,by=thr;
    for(const id in doc.pts){if(id===ex)continue;const p=doc.pts[id];const dx=Math.abs(p.x-raw.x),dy=Math.abs(p.y-raw.y);if(dx<bx){bx=dx;ax=p;}if(dy<by){by=dy;ay=p;}}
    for(const p of gpts){const dx=Math.abs(p.x-raw.x),dy=Math.abs(p.y-raw.y);if(dx<bx){bx=dx;ax=p;}if(dy<by){by=dy;ay=p;}}

cv.addEventListener('pointermove',e=>{
  const sp=spOf(e);
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,sp);
  if(gest&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const m=mid(a,b);const s=clamp(gest.s0*dist(a,b)/gest.d0,2,800);view.s=s;view.ox=m.x-gest.w.x*s;view.oy=m.y-gest.w.y*s;render();return;}
  if(!act){if(e.pointerType==='mouse'&&isDrawTool()){updatePreview(sp);render();}return;}
  if(!ptrs.has(e.pointerId))return;
  act.sp=sp;
  const dx=sp.x-(act.start?act.start.x:0),dy=sp.y-(act.start?act.start.y:0);
  switch(act.type){
    case 'place':updatePreview(sp);break;
    case 'pan':case 'tap':if(Math.hypot(dx,dy)>6)act.moved=true;if(act.moved){view.ox=act.o.ox+dx;view.oy=act.o.oy+dy;}break;
    case 'drag':if(!act.moved&&Math.hypot(dx,dy)>4){act.moved=true;pushUndo();}
      if(act.moved){const sn=snap(s2w(sp),{exclude:act.id});act.snap=sn;preview=sn;const p=doc.pts[act.id];p.x=r4(sn.x);p.y=r4(sn.y);}break;
    case 'dragLabel':if(!act.moved&&Math.hypot(dx,dy)>4){act.moved=true;pushUndo();}
      if(act.moved){const w=s2w(sp),L=doc.labels.find(x=>x.id===act.id);L.x=r4(w.x+act.off.x);L.y=r4(w.y+act.off.y);}break;
  }
  render();
});
function up(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(gest){if(ptrs.size<2){gest=null;act=ptrs.size?{type:'void'}:null;scheduleSave();}render();return;}
  if(!act)return;const a=act;act=null;
  if(e.type==='pointercancel'){preview=null;render();return;}
  switch(a.type){
    case 'place':updatePreview(a.sp);placePoint(preview);if(a.touch)preview=null;else updatePreview(a.sp);break;
    case 'tap':if(!a.moved)addLabelAt(s2w(a.sp));else scheduleSave();break;
    case 'pan':if(!a.moved&&a.sel){sel=a.hit||null;}else scheduleSave();break;
    case 'drag':if(a.moved){const sn=a.snap;if(sn&&sn.id&&doc.pts[sn.id]){mergePts(a.id,sn.id);sel={type:'pt',id:sn.id};toast('Puntos unidos');}else if(sn&&sn.seg){insertBetween(sn.seg.a,sn.seg.b,a.id);}preview=null;changed();}break;
    case 'dragLabel':if(a.moved)changed();break;
  }
  updateUI();render();
}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'&&!act&&preview&&isDrawTool()){preview=null;render();}});
cv.addEventListener('wheel',e=>{e.preventDefault();const sp=spOf(e),w=s2w(sp);const s=clamp(view.s*Math.exp(-e.deltaY*0.0015),2,800);view.s=s;view.ox=sp.x-w.x*s;view.oy=sp.y-w.y*s;render();clearTimeout(saveT);saveT=setTimeout(()=>{scheduleSave();},400);},{passive:false});

const dlg=$('#dlg'),dlgT=$('#dlgT'),dlgP=$('#dlgP'),dlgI=$('#dlgI'),dlgOk=$('#dlgOk'),dlgNo=$('#dlgNo');
function ask({title,text='',input=null,ok='Aceptar',danger=false}){
  return new Promise(res=>{
    dlgT.textContent=title;dlgP.textContent=text;dlgP.hidden=!text;dlgI.hidden=input===null;
    if(input!==null){dlgI.value=input.value||'';dlgI.placeholder=input.placeholder||'';}
    dlgOk.textContent=ok;dlgOk.className='btn '+(danger?'solid':'pri');dlg.hidden=false;
    if(input!==null)setTimeout(()=>{dlgI.focus();dlgI.select();},40);
    const done=v=>{dlg.hidden=true;dlgOk.onclick=dlgNo.onclick=dlgI.onkeydown=null;res(v);};
    dlgOk.onclick=()=>done(input!==null?dlgI.value:true);dlgNo.onclick=()=>done(null);
    dlgI.onkeydown=e=>{if(e.key==='Enter')dlgOk.click();if(e.key==='Escape')dlgNo.click();};
  });
}
async function addLabelAt(w){

}

const sheet=$('#sheet'),sheetBody=$('#sheetBody'),scrim=$('#scrim');
const X_ICON='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
function openSheet(html){sheetBody.innerHTML=html;sheet.hidden=false;scrim.hidden=false;sheet.scrollTop=0;}

const dateStr=t=>new Date(t).toLocaleDateString('es-HN',{day:'2-digit',month:'short',year:'numeric'});
function figCount(d){const n=d.lines.filter(l=>l.closed).length;return n===1?'1 figura':n+' figuras';}
function levelData(){const it=curIt();return it.levels.map((L,i)=>withDoc(L.doc,()=>{const R=rooms();return{i,name:L.name,R,F:L.doc.lines.filter(l=>l.closed&&!isSurf(l)),SF:L.doc.lines.filter(l=>l.closed&&isSurf(l)).map(l=>({name:l.name||'Superficie',A:areaOf(l),p:perim(linePts(l),true)})),A:R.reduce((s,f)=>s+f.A,0)};}));}
function summaryText(){
  const it=store.items[store.cur],I=info(),LD=levelData(),multi=LD.length>1;let grand=0;
  const out=[`LEVANTAMIENTO DE CAMPO · ${it.name}`];
  if(I.cliente)out.push(`Cliente: ${I.cliente}`);
  if(I.ubicacion)out.push(`Ubicación: ${I.ubicacion}`);
  if(hasCoords(I))out.push(`Coordenadas: ${coordStr(I)}`,`Mapa: ${mapsUrl(I)}`);
  out.push(`Fecha: ${fechaTxt(I)||new Date().toLocaleDateString('es-HN')}`);
  if(I.valuador)out.push(`Valuador: ${I.valuador}`);
  for(const d of LD){
    grand+=d.A;out.push('',multi?`${d.name.toUpperCase()} · ambientes:`:'Ambientes:');
    d.R.forEach(f=>out.push(`- ${f.name}: ${fmt(f.A)} m² (perímetro ${fmt(perim(f.P,true))} m)`));
    out.push(multi?`Total ${d.name}: ${fmt(d.A)} m²`:`Total encerrado: ${fmt(d.A)} m²`);
    if(d.SF.length){out.push(multi?`${d.name} · superficies:`:'Superficies:');d.SF.forEach(f=>out.push(`- ${f.name}: ${fmt(f.A)} m² (perímetro ${fmt(f.p)} m)`));}
  }
  if(multi)out.push('',`ÁREA TOTAL (${LD.length} niveles): ${fmt(grand)} m²`);
  if(I.notas)out.push('',`Observaciones: ${I.notas}`);
  return out.join('\n');
}
async function copyText(t,btn){try{await navigator.clipboard.writeText(t);toast('Resumen copiado');}catch(e){const ta=document.createElement('textarea');ta.className='copy';ta.value=t;btn.insertAdjacentElement('afterend',ta);ta.focus();ta.select();toast('Selecciona y copia el texto');}}
function info(){const it=store.items[store.cur];if(!it.info)it.info={fecha:todayISO()};return it.info;}
const hasCoords=I=>typeof I.lat==='number'&&typeof I.lng==='number';
const coordStr=I=>hasCoords(I)?`${I.lat.toFixed(6)}, ${I.lng.toFixed(6)}`:'';
function parseCoords(s){
  const t=String(s).replace(/%2C/gi,',');
  const m=t.match(/(-?\d{1,2}(?:\.\d+)?)\s*[,;\s]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!m)return null;const lat=parseFloat(m[1]),lng=parseFloat(m[2]);
  if(!isFinite(lat)||!isFinite(lng)||Math.abs(lat)>90||Math.abs(lng)>180)return null;return{lat,lng};
}
function mapsUrl(I){const q=hasCoords(I)?`${I.lat},${I.lng}`:(I.ubicacion||'');return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);}

function exportCanvas(li){
  const it=curIt(),L=it.levels[li];
  if(!Object.keys(L.doc.pts).length&&!L.doc.labels.length)return null;
  let x0=Infinity,y0=Infinity,x1=-Infinity,y1=-Infinity;
  it.levels.forEach(Lv=>Object.values(Lv.doc.pts).concat(Lv.doc.labels).forEach(p=>{x0=Math.min(x0,p.x);y0=Math.min(y0,p.y);x1=Math.max(x1,p.x);y1=Math.max(y1,p.y);}));
  const bw0=Math.max(x1-x0,1),bh0=Math.max(y1-y0,1),multi=it.levels.length>1;
  const R=withDoc(L.doc,rooms),SF=L.doc.lines.filter(l=>l.closed&&isSurf(l));
  const rows=R.map(f=>[f.name,'Ambiente',fmt(perim(f.P,true)),fmt(f.A)]);
  SF.forEach(l=>{const r=[l.name||'Superficie','Superficie',withDoc(L.doc,()=>fmt(perim(linePts(l),true))),withDoc(L.doc,()=>fmt(areaOf(l)))];r.green=true;rows.push(r);});
  const tot=R.reduce((s,f)=>s+f.A,0);
  const nonEmpty=it.levels.filter(Lv=>Object.keys(Lv.doc.pts).length||Lv.doc.labels.length);
  const col={paper:'#ffffff',grid:'#eef2ef','grid-strong':'#dfe6e1',ink:'#14303f',fill:'rgba(46,110,140,.08)','fill-sel':'rgba(46,110,140,.08)',accent:'#d9581a',dim:'#3b6276',text:'#14303f',muted:'#5a6c74',ghost:'rgba(104,116,124,.12)','ghost-line':'rgba(84,98,108,.5)',surf:'rgba(96,150,64,.12)','surf-line':'#3f6e2a'};
  return buildSheet({kind:'PLANTA',label:multi?L.name:'Planta',boxTitle:multi?L.name:'',page:nonEmpty.indexOf(L)+1,pages:nonEmpty.length+'',
    cols:[{h:'Descripción',w:.46},{h:'Tipo',w:.18},{h:'Perímetro (m)',w:.18,r:1,mono:1},{h:'Área (m²)',w:.18,r:1,mono:1}],
    rows,total:R.length?[multi?'Área de construcción · '+L.name:'Área de construcción',fmt(tot)+' m²']:null,
    drawBox:(x,bx,by,bw,bh)=>{const pad=110,s=Math.min((bw-2*pad)/bw0,(bh-2*pad)/bh0,160);
      const v={s,ox:bx+(bw-bw0*s)/2-x0*s,oy:by+(bh-bh0*s)/2-y0*s};
      x.save();x.strokeStyle='#eef2ef';x.lineWidth=1;const st=s>=60?1:s>=25?2:5;
      for(let gx=Math.floor((bx-v.ox)/s/st)*st;gx*s+v.ox<bx+bw;gx+=st){const px=Math.round(gx*s+v.ox)+.5;x.beginPath();x.moveTo(px,by);x.lineTo(px,by+bh);x.stroke();}
      for(let gy=Math.floor((by-v.oy)/s/st)*st;gy*s+v.oy<by+bh;gy+=st){const py=Math.round(gy*s+v.oy)+.5;x.beginPath();x.moveTo(bx,py);x.lineTo(bx+bw,py);x.stroke();}
      x.restore();
      withDoc(L.doc,()=>drawScene(x,v,col,{w:SH.W,h:99999,grid:false,live:false,k:1.9,noBg:true}));
      return{scale:s};}});
}

/* Guarda un archivo: dentro de Claude usa su confirmación de descarga; instalada usa Compartir (iPhone/iPad → «Guardar imagen») o descarga normal. Devuelve 'saved' | 'cancel' | 'busy' | 'manual'. */
async function saveBlob(blob,filename,mime){
  const dlNS=await getDL();
  if(dlNS){try{await dlNS.save({filename,data:blob});return 'saved';}catch(err){const c=err&&err.code;if(c==='declined')return 'cancel';if(c==='rate_limited')return 'busy';return 'manual';}}
  if(window.claude)return 'manual';
  try{const file=new File([blob],filename,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return 'saved';}}
  catch(err){if(err&&err.name==='AbortError')return 'cancel';}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return 'saved';}catch(e){return 'manual';}
}
async function saveImage(c,li){
  const say=t=>{const m=$('#saveMsg');if(m)m.textContent=t;};
  const manual='Mantén presionada la imagen y elige «Guardar en Fotos» (en computadora: clic derecho, «Guardar imagen como»).';
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  if(!blob){say(manual);return;}
  const r=await saveBlob(blob,fileName(li),'image/png');
  if(r==='saved'){say('Listo: '+fileName(li)+'. En iPhone o iPad elige «Guardar imagen» para que quede en Fotos.');toast('Imagen lista');}
  else if(r==='cancel')say('Guardado cancelado. Toca «Guardar imagen» para intentarlo de nuevo.');
  else if(r==='busy')say('Hay una confirmación abierta. Respóndela o espera un momento.');
  else{say(manual);const b=$('#svImg');if(b)b.hidden=true;}
}

        const blob=await new Promise(r=>ci.toBlob(r,'image/png'));const r=await saveBlob(blob,fileName(i),'image/png');if(r==='cancel')break;if(r==='saved')n++;else if(r==='manual'){$('#saveMsg').textContent='Este dispositivo no permite guardar varias a la vez; elige cada nivel y guárdalo.';break;}}
      if(n)$('#saveMsg').textContent=`Listo: ${n} ${n===1?'imagen':'imágenes'}, una por nivel.`;}
    if(t.id==='cpImg'){try{const blob=await new Promise(r=>c.toBlob(r,'image/png'));await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('Imagen copiada');}catch(err){toast('Este dispositivo no permite copiar; mantén presionada la imagen');}}};
}

/* ---------- niveles ---------- */
const PLUS='<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
function renderLevels(){
  const it=curIt(),box=$('#lvTabs');
  box.innerHTML=it.levels.map((L,i)=>`<button class="lv${i===it.lvl?' on':''}" data-lv="${i}">${esc(L.name)}</button>`).join('')+`<button class="lv add" id="bAddLv" aria-label="Agregar nivel">${PLUS}<span>Nivel</span></button>`;
  const gb=$('#bGhost');gb.setAttribute('aria-pressed',S.ghost&&it.lvl>0);gb.style.opacity=it.lvl>0?'':'.55';
  const on=box.querySelector('.on');if(on&&on.scrollIntoView)try{on.scrollIntoView({block:'nearest',inline:'nearest'});}catch(e){}
}
function goLevel(i){
  const it=curIt();if(i===it.lvl)return;
  if(drawing)endDrawing();
  it.levels[it.lvl].doc=doc;it.lvl=i;doc=it.levels[i].doc;
  drawing=null;sel=null;preview=null;undoS=[];redoS=[];lastSelKey='';
  changed();
  toast(i>0&&S.ghost?`${it.levels[i].name} · sombra de ${it.levels[i-1].name}`:it.levels[i].name);
}
async function addLevel(){
  const it=curIt();
  const n=await ask({title:'Nuevo nivel',text:'Se agrega encima del último. Verás la sombra del nivel de abajo para guiarte.',input:{value:'Nivel '+(it.levels.length+1)},ok:'Crear'});
  if(n===null)return;
  if(drawing)endDrawing();
  it.levels[it.lvl].doc=doc;
  it.levels.push({id:'v'+Date.now(),name:n.trim()||'Nivel '+(it.levels.length+1),doc:blankDoc()});
  it.example=false;S.ghost=true;
  const i=it.levels.length-1;it.lvl=i;doc=it.levels[i].doc;drawing=null;sel=null;preview=null;undoS=[];redoS=[];lastSelKey='';
  setTool('line');changed();saveNow();toast(`${it.levels[i].name} creado · ves la sombra de ${it.levels[i-1].name}`);
}
function copyBelow(){
  const it=curIt();if(it.lvl<1)return;const src=it.levels[it.lvl-1].doc;
  if(!src.lines.length){toast('El nivel de abajo está vacío');return;}
  pushUndo();const map={};
  for(const id in src.pts)map[id]=newPt(src.pts[id].x,src.pts[id].y);
  for(const l of src.lines)doc.lines.push({id:newId('l'),pts:l.pts.map(p=>map[p]),closed:l.closed,name:l.name,...(l.kind?{kind:l.kind}:{})});
  changed();toast('Líneas copiadas de '+it.levels[it.lvl-1].name);
}
function openLevel(){
  const it=curIt(),L=it.levels[it.lvl],i=it.lvl,below=i>0?it.levels[i-1]:null;
  openSheet(`<div class="shead"><h2>${esc(L.name)}</h2><button class="ib" data-close aria-label="Cerrar">${X_ICON}</button></div>
  <label class="field"><span>Nombre del nivel</span><input id="lvName" value="${esc(L.name)}" placeholder="Planta baja, Segundo nivel, Terraza…" autocomplete="off"></label>
  ${below?`<label class="sw"><input type="checkbox" id="lvGhost" ${S.ghost?'checked':''}><span>Mostrar la sombra de «${esc(below.name)}» debajo de este nivel</span></label>
  <p class="hint">Con el imán activo, los puntos de la sombra también atraen el trazo, así las paredes de arriba quedan alineadas con las de abajo.</p>`:`<p class="hint">Este es el nivel más bajo. Al agregar un nivel encima, verás este dibujo como sombra.</p>`}
  <div class="row" style="margin-top:14px">
    <button class="btn pri" id="lvAdd">Agregar nivel encima</button>
    ${below?`<button class="btn" id="lvCopy">Copiar líneas de «${esc(below.name)}»</button>`:''}
    ${i>0?`<button class="btn" id="lvDown">Bajar</button>`:''}${i<it.levels.length-1?`<button class="btn" id="lvUp">Subir</button>`:''}
    ${it.levels.length>1?`<button class="btn danger" id="lvDel">Eliminar nivel</button>`:''}
  </div>`);
  $('#lvName').addEventListener('input',e=>{L.name=e.target.value.trim()||'Nivel '+(i+1);it.example=false;scheduleSave();renderLevels();});
  $('#lvName').addEventListener('keydown',e=>{if(e.key==='Enter')e.target.blur();});
  const gc=$('#lvGhost');if(gc)gc.addEventListener('change',e=>{S.ghost=e.target.checked;scheduleSave();renderLevels();render();});
  sheetBody.onclick=async e=>{
    const t=e.target.closest('button');if(!t)return;
    if(t.hasAttribute('data-close'))closeSheet();
    else if(t.id==='lvAdd'){closeSheet();addLevel();}
    else if(t.id==='lvCopy'){closeSheet();copyBelow();}
    else if(t.id==='lvUp'||t.id==='lvDown'){const j=t.id==='lvUp'?i+1:i-1;if(drawing)endDrawing();it.levels[i].doc=doc;[it.levels[i],it.levels[j]]=[it.levels[j],it.levels[i]];it.lvl=j;doc=it.levels[j].doc;sel=null;undoS=[];redoS=[];changed();openLevel();}
    else if(t.id==='lvDel'){closeSheet();const okk=await ask({title:`¿Eliminar «${L.name}»?`,text:'Se borrará todo lo dibujado en este nivel. No se puede deshacer.',ok:'Eliminar',danger:true});
      if(okk){it.levels.splice(i,1);it.lvl=Math.max(0,i-1);doc=it.levels[it.lvl].doc;drawing=null;sel=null;preview=null;undoS=[];redoS=[];changed();saveNow();toast('Nivel eliminado');}}
  };
}
$('#lvTabs').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.id==='bAddLv'){addLevel();return;}const i=+t.dataset.lv;if(i===curIt().lvl)openLevel();else goLevel(i);});
$('#bGhost').onclick=()=>{if(curIt().lvl<1){toast('Este es el nivel más bajo: no hay sombra debajo');return;}S.ghost=!S.ghost;scheduleSave();renderLevels();render();toast(S.ghost?'Sombra del nivel inferior visible':'Sombra oculta');};

/* ---------- vista 3D ---------- */
let threeP=null;
function loadThree(){if(window.THREE)return Promise.resolve();if(threeP)return threeP;
  threeP=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';sc.onload=()=>res();sc.onerror=()=>{threeP=null;rej();};document.head.appendChild(sc);});return threeP;}
const lvH=L=>(L.h>0?L.h:2.6);
let v3=null;
function open3D(){
  if(drawing)endDrawing();scheduleSave();
  const it=curIt();
  const box=document.createElement('div');box.className='v3d';
  box.innerHTML=`<header class="top gut"><button class="ib" id="v3Close" aria-label="Volver al plano"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7"/></svg></button><span class="t3">Vista 3D · ${esc(it.name)}</span><button class="ib" id="v3Fit" aria-label="Centrar vista"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button><button class="ib" id="v3Save" aria-label="Guardar imagen 3D"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="m4 17 5-5 4 4 2.5-2.5L20 18"/><circle cx="15.5" cy="9" r="1.5"/></svg></button></header>
  <div class="v3stage" id="v3Stage"><div class="v3msg" id="v3Msg">Cargando vista 3D…</div><div class="v3help" id="v3Help" hidden>Un dedo: girar · Dos dedos: acercar y mover</div></div>
  <footer class="dock gut">
    ${it.levels.length>1?`<div class="v3row"><span class="lbl">Ver</span><div class="segc" id="v3Upto">${it.levels.map((L,i)=>`<button data-upto="${i}">${i===it.levels.length-1?'Todos':'Hasta '+esc(L.name)}</button>`).join('')}</div></div>`:''}
    <div class="v3row"><label class="lbl" for="v3H">Altura de ${esc(it.levels[it.lvl].name)}</label><div class="lenrow sm"><input id="v3H" inputmode="decimal" autocomplete="off" value="${fmt(lvH(it.levels[it.lvl]))}"><span class="unit">m</span></div></div>
  </footer>`;
  document.body.appendChild(box);
  const st={upto:it.levels.length-1,box,raf:0,alive:true};v3=st;
  const close=()=>{st.alive=false;cancelAnimationFrame(st.raf);if(st.ro)st.ro.disconnect();if(st.r){st.r.dispose();st.scene&&st.scene.traverse(o=>{o.geometry&&o.geometry.dispose();});}box.remove();v3=null;};
  box.querySelector('#v3Close').onclick=close;
  st.close=close;
  const markUpto=()=>box.querySelectorAll('[data-upto]').forEach(b=>b.classList.toggle('on',+b.dataset.upto===st.upto));markUpto();
  loadThree().then(()=>{if(st.alive)init3D(st,markUpto);}).catch(()=>{const m=box.querySelector('#v3Msg');m.textContent='No se pudo cargar la vista 3D. Revisa tu conexión a internet e inténtalo de nuevo.';});
}
function init3D(st,markUpto){
  const T=window.THREE,box=st.box,stg=box.querySelector('#v3Stage'),it=curIt();
  box.querySelector('#v3Msg').remove();box.querySelector('#v3Help').hidden=false;setTimeout(()=>{const h=box.querySelector('#v3Help');if(h)h.hidden=true;},5000);
  const r=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});st.r=r;
  r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
  stg.appendChild(r.domElement);const cvs=r.domElement;
  const scene=new T.Scene();st.scene=scene;
  const cam=new T.PerspectiveCamera(45,1,0.1,2000);
  scene.add(new T.HemisphereLight(0xffffff,0x8a9690,0.75));
  const sun=new T.DirectionalLight(0xffffff,0.75);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);scene.add(sun.target);
  const world=new T.Group();scene.add(world);
  let ctr=new T.Vector3(),rad=20,theta=-Math.PI*0.75,phi=1.0,dist3=30;
  function colors(){const cs=getComputedStyle(document.documentElement);const gv=k=>cs.getPropertyValue('--'+k).trim();
    return{paper:new T.Color(gv('paper')),ink:new T.Color(gv('ink')),accent:new T.Color(gv('accent')),grid:new T.Color(gv('grid-strong'))};}
  function build(){
    while(world.children.length){const o=world.children[world.children.length-1];world.remove(o);o.traverse(c=>{c.geometry&&c.geometry.dispose();c.material&&c.material.dispose&&c.material.dispose();});}
    it.levels[it.lvl].doc=doc;
    const K=colors();scene.background=K.paper;
    const wallM=new T.MeshStandardMaterial({color:0xf2efe8,roughness:.9});
    const wallCur=new T.MeshStandardMaterial({color:0xfbe9dc,roughness:.9});
    const floorM=[0xc9d6dc,0xd8d2c4,0xc7d3c6,0xd6cbd3].map(c=>new T.MeshStandardMaterial({color:c,roughness:.95,side:T.DoubleSide}));
    const edgeM=new T.LineBasicMaterial({color:K.ink,transparent:true,opacity:.55});
    const surfM=new T.MeshStandardMaterial({color:0x9cc47e,roughness:1,side:T.DoubleSide,transparent:true,opacity:.85,polygonOffset:true,polygonOffsetFactor:-1});const surfE=new T.LineBasicMaterial({color:0x3f6e2a});
    const t=0.15,slab=0.12;let elev=0;const bb=new T.Box3();
    it.levels.forEach((L,i)=>{
      if(i>st.upto){return;}
      const h=lvH(L);
      withDoc(L.doc,()=>{
        for(const f of rawFaces()){
          const sh=new T.Shape(f.P.map(p=>new T.Vector2(p.x,-p.y)));
          const gm=new T.ExtrudeGeometry(sh,{depth:slab,bevelEnabled:false});gm.rotateX(-Math.PI/2);gm.translate(0,elev,0);
          const m=new T.Mesh(gm,floorM[i%floorM.length]);m.receiveShadow=true;world.add(m);
        }
        for(const l of L.doc.lines){if(!isSurf(l)||!l.closed||l.pts.length<3)continue;
          const gm=new T.ShapeGeometry(new T.Shape(linePts(l).map(p=>new T.Vector2(p.x,-p.y))));gm.rotateX(-Math.PI/2);gm.translate(0,elev+(i?slab+0.01:0.004),0);
          const m=new T.Mesh(gm,surfM);m.receiveShadow=true;world.add(m);
          const e=new T.LineLoop(new T.BufferGeometry().setFromPoints(linePts(l).map(p=>new T.Vector3(p.x,elev+(i?slab+0.02:0.01),p.y))),surfE);world.add(e);}
        for(const s of segs('w')){if(s.dup)continue;const a=doc.pts[s.a],b=doc.pts[s.b],len=dist(a,b);if(len<0.02)continue;
          const gm=new T.BoxGeometry(len+t,h,t);const m=new T.Mesh(gm,i===it.lvl&&it.levels.length>1?wallCur:wallM);
          m.position.set((a.x+b.x)/2,elev+h/2,(a.y+b.y)/2);m.rotation.y=-Math.atan2(b.y-a.y,b.x-a.x);m.castShadow=true;m.receiveShadow=true;world.add(m);
          const e=new T.LineSegments(new T.EdgesGeometry(gm),edgeM);e.position.copy(m.position);e.rotation.copy(m.rotation);world.add(e);}
      });
      elev+=h;
    });
    bb.setFromObject(world);
    const empty=bb.isEmpty();if(empty)bb.set(new T.Vector3(-5,0,-5),new T.Vector3(5,3,5));
    const gsz=Math.max(bb.max.x-bb.min.x,bb.max.z-bb.min.z)+12;
    const ground=new T.Mesh(new T.PlaneGeometry(gsz*3,gsz*3),new T.ShadowMaterial({opacity:.18}));ground.rotation.x=-Math.PI/2;ground.position.y=-0.005;ground.receiveShadow=true;world.add(ground);
    const gh=new T.GridHelper(Math.ceil(gsz),Math.ceil(gsz),K.grid,K.grid);gh.position.set((bb.min.x+bb.max.x)/2,-0.01,(bb.min.z+bb.max.z)/2);gh.material.transparent=true;gh.material.opacity=.6;world.add(gh);
    const c=new T.Vector3();bb.getCenter(c);const size=new T.Vector3();bb.getSize(size);
    st.bb={c,rad:Math.max(size.x,size.y,size.z,4)};
    sun.position.set(c.x+size.x+10,size.y+25,c.z+size.z*0.6+8);sun.target.position.copy(c);
    const sc=sun.shadow.camera,R2=Math.max(size.x,size.z)+10;sc.left=-R2;sc.right=R2;sc.top=R2;sc.bottom=-R2;sc.near=1;sc.far=200;sc.updateProjectionMatrix();
    if(empty){const m=box.querySelector('.v3stage');const d=document.createElement('div');d.className='v3msg';d.id='v3Empty';d.textContent='Aún no hay líneas para levantar. Dibuja el plano y vuelve aquí.';if(!m.querySelector('#v3Empty'))m.appendChild(d);}
  }
  function fit3(){ctr.copy(st.bb.c);dist3=st.bb.rad*1.9+4;phi=1.0;theta=-Math.PI*0.75;}
  function place(){phi=clamp(phi,0.08,Math.PI/2-0.02);dist3=clamp(dist3,1.5,600);
    cam.position.set(ctr.x+dist3*Math.sin(phi)*Math.cos(theta),ctr.y+dist3*Math.cos(phi),ctr.z+dist3*Math.sin(phi)*Math.sin(theta));cam.lookAt(ctr);}
  function size(){const b=stg.getBoundingClientRect();if(!b.width)return;r.setSize(b.width,b.height,false);cam.aspect=b.width/b.height;cam.updateProjectionMatrix();}
  st.ro=new ResizeObserver(size);st.ro.observe(stg);size();
  build();fit3();
  const loop=()=>{if(!st.alive)return;place();r.render(scene,cam);st.raf=requestAnimationFrame(loop);};loop();
  /* gestos: 1 dedo gira, 2 dedos acercan y desplazan */
  const P=new Map();let g0=null;
  const pan=(dx,dy)=>{const k=dist3*0.0016;const right=new T.Vector3(-Math.sin(theta),0,Math.cos(theta));const fwd=new T.Vector3(Math.cos(theta),0,Math.sin(theta));ctr.addScaledVector(right,dx*k).addScaledVector(fwd,-dy*k);};
  cvs.addEventListener('pointerdown',e=>{try{cvs.setPointerCapture(e.pointerId);}catch(_){}P.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});if(P.size===2){const[a,b]=[...P.values()];g0={d:Math.hypot(a.x-b.x,a.y-b.y)||1,dist:dist3,m:{x:(a.x+b.x)/2,y:(a.y+b.y)/2}};}});
  cvs.addEventListener('pointermove',e=>{const o=P.get(e.pointerId);if(!o)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;
    if(P.size>=2&&g0){const[a,b]=[...P.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;dist3=g0.dist*g0.d/d;const m={x:(a.x+b.x)/2,y:(a.y+b.y)/2};pan(m.x-g0.m.x,m.y-g0.m.y);g0.m=m;return;}
    if(o.b===2||e.shiftKey)pan(dx,dy);else{theta+=dx*0.008;phi-=dy*0.008;}});
  const upE=e=>{P.delete(e.pointerId);if(P.size<2)g0=null;};
  cvs.addEventListener('pointerup',upE);cvs.addEventListener('pointercancel',upE);cvs.addEventListener('contextmenu',e=>e.preventDefault());
  cvs.addEventListener('wheel',e=>{e.preventDefault();dist3*=Math.exp(e.deltaY*0.0012);},{passive:false});
  box.querySelector('#v3Fit').onclick=fit3;
  box.querySelectorAll('[data-upto]').forEach(b=>b.onclick=()=>{st.upto=+b.dataset.upto;markUpto();build();});
  const hI=box.querySelector('#v3H');
  hI.addEventListener('change',()=>{const v=parseNum(hI.value);if(!(v>=1&&v<=20)){toast('Escribe una altura entre 1 y 20 m');hI.value=fmt(lvH(it.levels[it.lvl]));return;}it.levels[it.lvl].h=r4(v);hI.value=fmt(v);scheduleSave();build();});
  hI.addEventListener('keydown',e=>{if(e.key==='Enter')hI.blur();});
  box.querySelector('#v3Save').onclick=async()=>{
    const LD=levelData().filter(d=>d.i<=st.upto);const all=st.upto===it.levels.length-1;
    const rows=LD.map(d=>[d.name,d.R.length===1?'1 ambiente':d.R.length+' ambientes',fmt(lvH(it.levels[d.i])),fmt(d.A)]);
    const c=buildSheet({kind:'VISTA 3D',label:all?(it.levels.length>1?'Todos los niveles':'Volumetría'):'Hasta '+it.levels[st.upto].name,boxTitle:'',boxNote:'Vista ilustrativa · no a escala',page:1,pages:1,
      cols:[{h:'Nivel',w:.4},{h:'Ambientes',w:.2},{h:'Altura (m)',w:.2,r:1,mono:1},{h:'Área (m²)',w:.2,r:1,mono:1}],
      rows,total:['Área total de construcción',fmt(LD.reduce((s,d)=>s+d.A,0))+' m²'],
      drawBox:(x,bx,by,bw,bh)=>{const bg=scene.background,pr=r.getPixelRatio();scene.background=new T.Color(0xffffff);
        r.setPixelRatio(1);r.setSize(Math.round(bw),Math.round(bh),false);cam.aspect=bw/bh;cam.updateProjectionMatrix();place();r.render(scene,cam);
        x.drawImage(cvs,bx,by,bw,bh);scene.background=bg;r.setPixelRatio(pr);size();place();r.render(scene,cam);}});
    const nm=fileName().replace(/\.png$/,'')+' - 3D.png';
    const ov=document.createElement('div');ov.className='dlg';ov.innerHTML=`<div class="dlgbox" style="width:min(560px,100%);max-height:90%;overflow:auto"><h3>Hoja de vista 3D</h3><p id="v3sMsg">Guardando la imagen…</p><img class="expimg" src="${c.toDataURL('image/png')}" alt="Hoja de vista 3D"><div class="row end"><button class="btn" id="v3sNo">Cerrar</button><button class="btn pri" id="v3sOk">Guardar imagen</button></div></div>`;
    box.appendChild(ov);
    const doSave=async()=>{const blob=await new Promise(res=>c.toBlob(res,'image/png'));const res=blob?await saveBlob(blob,nm,'image/png'):'manual';const m=ov.querySelector('#v3sMsg');
      m.textContent=res==='saved'?'Listo: '+nm:res==='cancel'?'Guardado cancelado.':res==='busy'?'Hay una confirmación abierta; espera un momento.':'Mantén presionada la imagen y elige «Guardar en Fotos».';};
    ov.querySelector('#v3sNo').onclick=()=>ov.remove();ov.querySelector('#v3sOk').onclick=doSave;doSave();
  };
}
$('#b3d').onclick=open3D;

/* ---------- tema ---------- */
const mq=matchMedia('(prefers-color-scheme: dark)');
const onTheme=()=>{readColors();render();};
mq.addEventListener?mq.addEventListener('change',onTheme):mq.addListener(onTheme);
new MutationObserver(onTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);

updateUI();resize();
/* sin conexión: solo en la app instalada (fuera de Claude) */
if(!window.claude&&'serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
